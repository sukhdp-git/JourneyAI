<!doctype html><html><head><meta charset="utf-8"><title>Tilt reel</title><style>
@font-face { font-family: Mono; src: url(../../../../public/assets/fonts/jetbrains-mono.woff2); }
@font-face { font-family: Jakarta; src: url(../../../../public/assets/fonts/plus-jakarta-sans.woff2); font-weight: 200 800; }
@font-face { font-family: Hand; src: url(../../../../public/assets/fonts/instrument-serif-italic.woff2); }
html,body{margin:0;background:#060613} canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
const C = document.getElementById('c'), g = C.getContext('2d'); const W = 1080, H = 1920;
const RED = '#f87171', GREEN = '#34d399', INK = '#f2f0fa', MUTED = '#9d9abb', FAINT = '#67648a';
const S = [0, 3.5, 7, 10.5, 14, 17.5, 21.5]; // scene starts
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - clamp(x), 3);
let seed = 1; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function txt(s, x, y, size, col, align = 'center', weight = 700, font = 'Mono', alpha = 1) { g.save(); g.globalAlpha = alpha; g.font = `${weight} ${size}px ${font}`; g.fillStyle = col; g.textAlign = align; g.fillText(s, x, y); g.restore(); }
function gradText(s, x, y, size, align = 'center', font = 'Mono', weight = 700) { g.save(); g.font = `${weight} ${size}px ${font}`; g.textAlign = align; const w = g.measureText(s).width; const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x; const gr = g.createLinearGradient(x0, 0, x0 + w, 0); gr.addColorStop(0, '#7c5cff'); gr.addColorStop(.6, '#c084d8'); gr.addColorStop(1, '#feb2b4'); g.fillStyle = gr; g.fillText(s, x, y); g.restore(); }
function bg() { g.fillStyle = '#060613'; g.fillRect(0, 0, W, H); const gr = g.createRadialGradient(W * .2, 0, 0, W * .2, 0, 1000); gr.addColorStop(0, 'rgba(124,92,255,.16)'); gr.addColorStop(1, 'rgba(124,92,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function pop(v, x, y, t0, t, size = 56) { const p = (t - t0) / 1.0; if (p < 0 || p > 1) return; txt((v < 0 ? '−$' : '+$') + Math.abs(v).toLocaleString('en-US'), x, y - p * 70, size, v < 0 ? RED : GREEN, 'center', 800, 'Mono', 1 - p * p); }
function candles(x, y, w, h, n, drift, s, upTo) { seed = s; let p = 0; const cs = []; for (let i = 0; i < n; i++) { const o = p, c = o + drift(i) + (rnd() - .5) * 4; cs.push({ o, c, h: Math.max(o, c) + rnd() * 2, l: Math.min(o, c) - rnd() * 2 }); p = c; }
  const hi = Math.max(...cs.map(k => k.h)), lo = Math.min(...cs.map(k => k.l)), yy = v => y + (hi - v) / (hi - lo) * h, st = w / n;
  cs.slice(0, upTo ?? n).forEach((k, i) => { const col = k.c >= k.o ? '#34d399' : '#f87171', cx = x + i * st + st / 2; g.strokeStyle = col; g.lineWidth = Math.max(2, st * .12); g.beginPath(); g.moveTo(cx, yy(k.h)); g.lineTo(cx, yy(k.l)); g.stroke(); g.fillStyle = col; g.fillRect(cx - st * .3, Math.min(yy(k.o), yy(k.c)), st * .6, Math.max(3, Math.abs(yy(k.c) - yy(k.o)))); }); }
// seated stick figure at a desk; pose: type | slam | read | stand | walk
function desk(x, gy, o) {
  g.fillStyle = '#1d1a3a'; g.fillRect(x - 40, gy - 210, 420, 16); g.fillRect(x + 330, gy - 194, 12, 194); // desk
  const shake = o.shake ? Math.sin(o.shake * 60) * 6 : 0;
  g.save(); g.translate(shake, 0); g.fillStyle = '#2a2550'; g.fillRect(x + 140, gy - 360, 210, 140); g.fillStyle = '#0b0b1d'; g.fillRect(x + 150, gy - 350, 190, 120); g.fillStyle = '#3a3766'; g.fillRect(x + 120, gy - 222, 250, 12);
  candles(x + 155, gy - 340, 180, 100, 14, o.chartDrift || (i => -.6), 3); g.restore();
  if (o.book) { g.save(); g.globalAlpha = o.book; g.fillStyle = '#fff'; g.fillRect(x + 20, gy - 250, 110, 36); g.fillStyle = '#7c5cff'; g.fillRect(x + 20, gy - 250, 110, 8); g.restore(); }
  const walk = o.walk || 0, bx = x - 90 + walk * 520; g.strokeStyle = INK; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
  const standing = o.pose === 'stand' || o.pose === 'walk';
  const hipY = standing ? gy - 150 : gy - 130, neckY = hipY - 150, headY = neckY - 44;
  if (!standing) { g.strokeStyle = '#3a3766'; g.beginPath(); g.moveTo(bx - 50, gy); g.lineTo(bx - 50, gy - 130); g.lineTo(bx + 30, gy - 130); g.stroke(); g.strokeStyle = INK; // chair
    g.beginPath(); g.moveTo(bx, hipY); g.lineTo(bx + 90, hipY); g.lineTo(bx + 90, gy); g.stroke(); }
  else { const sw = Math.sin(walk * 30) * 30 * (o.pose === 'walk' ? 1 : 0); g.beginPath(); g.moveTo(bx - 30 + sw, gy); g.lineTo(bx, hipY); g.lineTo(bx + 30 - sw, gy); g.stroke(); }
  g.beginPath(); g.moveTo(bx, hipY); g.lineTo(bx + 6, neckY); g.stroke();
  g.beginPath(); g.arc(bx + 8, headY, 36, 0, 7); g.fillStyle = '#060613'; g.fill(); g.stroke();
  g.fillStyle = INK; g.beginPath(); g.arc(bx + 22, headY - 4, 4, 0, 7); g.arc(bx + 34, headY - 4, 4, 0, 7); g.fill();
  if (o.angry) { g.lineWidth = 4; g.beginPath(); g.moveTo(bx + 14, headY - 16); g.lineTo(bx + 28, headY - 10); g.moveTo(bx + 42, headY - 16); g.lineTo(bx + 30, headY - 10); g.stroke(); g.lineWidth = 9; }
  const sx = bx + 6, sy = neckY + 24;
  if (o.pose === 'slam') { const u = o.slamUp; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + 70, sy - 40 - 60 * u); g.lineTo(sx + 130, sy - 10 - 120 * u + (1 - u) * 90); g.stroke(); }
  else if (o.pose === 'read') { g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + 60, sy + 30); g.lineTo(sx + 110, sy - 20); g.stroke(); g.fillStyle = '#fff'; g.fillRect(sx + 96, sy - 90, 90, 110); g.fillStyle = '#7c5cff'; g.fillRect(sx + 96, sy - 90, 10, 110); }
  else if (standing) { g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + 20 + Math.sin(walk * 30) * 20, sy + 110); g.stroke(); }
  else { g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + 80, sy + 50); g.lineTo(sx + 150, sy + 46); g.stroke(); } // typing
}
function label(s, y, sub) { txt(s, W / 2, y, 42, INK, 'center', 800); if (sub) txt(sub, W / 2, y + 40, 24, MUTED, 'center', 500); }
// ---------------- scenes ----------------
function s1(t) { // close-up chart, two losses
  candles(80, 520, 920, 900, 26, i => i < 10 ? .6 : i < 14 ? -2.4 : i < 18 ? .4 : -2.8, 11, 6 + Math.floor(t * 7));
  const n = Math.floor(clamp(t / 1.0) * 18); txt('2 LOSSES IN A ROW.'.slice(0, n), W / 2, 330, 64, INK, 'center', 800);
  pop(-100, 380, 900, .9, t, 72); pop(-100, 720, 1200, 1.9, t, 72);
  txt('P&L', W - 70, 440, 26, FAINT, 'right', 500); const pl = t > 2.2 ? -200 : t > 1.2 ? -100 : 0; txt(pl ? '−$' + -pl : '$0', W - 70, 482, 44, pl ? RED : MUTED, 'right', 800);
}
function s2(t) { // split desks
  g.fillStyle = '#0b0b1d'; g.fillRect(0, 940, W, 40);
  label('TRADER A', 140, 'wants it back. now.'); label('TRADER B', 1060, 'opens the journal.');
  const slam = t > .8 && t < 2.6; desk(240, 880, { pose: slam ? 'slam' : 'type', slamUp: slam ? Math.abs(Math.sin((t - .8) * 5)) : 0, angry: t > .6, shake: slam && Math.sin((t - .8) * 5) < .2 ? t : 0 });
  if (t > 1.0) { g.save(); g.globalAlpha = clamp((t - 1) * 4); g.fillStyle = '#fff'; g.beginPath(); g.roundRect(560, 300, 380, 70, 18); g.fill(); txt('I want it back.', 750, 348, 32, '#15132a', 'center', 800); g.restore(); }
  const b = clamp((t - .9) * 2); desk(240, 1800, { pose: b > .5 ? 'read' : 'type', book: 1 - b });
  pop(-100, 560, 600, -1, t);
}
function s3(t) { // zoom on Trader A's ticket: lot size + heart rate
  label('TRADER A', 140, 'revenge mode');
  const lots = t < 1 ? '0.50' : t < 1.9 ? '1.00' : '2.00'; const sh = (t > 1 && t < 1.15) || (t > 1.9 && t < 2.05) ? 10 : 0;
  g.save(); g.translate((rnd() - .5) * sh, (rnd() - .5) * sh);
  g.fillStyle = '#0e0e22'; g.beginPath(); g.roundRect(110, 260, 860, 620, 36); g.fill(); g.strokeStyle = '#3a2030'; g.lineWidth = 3; g.stroke();
  txt('XAUUSD · BUY', 170, 350, 36, MUTED, 'left', 600); txt('LOT SIZE', 170, 470, 30, FAINT, 'left', 600);
  txt(lots, W / 2, 680, 230, lots === '2.00' ? RED : INK, 'center', 800); txt('no plan · no stop · just anger', W / 2, 820, 30, RED, 'center', 600);
  g.restore();
  // heart rate
  const bpm = Math.round(92 + clamp(t / 3) * 60); txt('♥ ' + bpm + ' BPM', 170, 1060, 40, RED, 'left', 800);
  g.strokeStyle = RED; g.lineWidth = 6; g.beginPath(); for (let x = 0; x <= 860; x += 4) { const ph = (x / 860) * 6 + t * 6; const f = ph % 1; const yv = f < .08 ? -120 * Math.sin(f / .08 * Math.PI) : f < .14 ? 50 * Math.sin((f - .08) / .06 * Math.PI) : 0; const X = 110 + x, Y = 1240 + yv; x ? g.lineTo(X, Y) : g.moveTo(X, Y); } g.stroke();
  pop(-200, 300, 1500, .8, t, 76); pop(-400, 560, 1620, 1.7, t, 76); pop(-600, 800, 1500, 2.5, t, 76);
  const tot = -200 - (t > 1.1 ? 200 : 0) - (t > 2 ? 400 : 0) - (t > 2.8 ? 600 : 0); txt('P&L', W - 110, 1050, 26, FAINT, 'right', 500); txt('−$' + (-tot).toLocaleString('en-US'), W - 110, 1100, 52, RED, 'right', 800);
}
function s4(t) { // Trader B: journal rule + cooldown + walks away
  label('TRADER B', 140, 'reads one line');
  g.save(); g.translate(110, 260); g.rotate(-.02); g.fillStyle = '#fbfaff'; g.beginPath(); g.roundRect(0, 0, 860, 600, 26); g.fill(); g.fillStyle = '#7c5cff'; g.fillRect(0, 0, 24, 600);
  g.strokeStyle = '#e5e1f5'; g.lineWidth = 2; for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(60, 110 + i * 56); g.lineTo(820, 110 + i * 56); g.stroke(); }
  txt('MY RULES', 70, 80, 30, '#8f8ca8', 'left', 700);
  const hl = clamp((t - .4) * 2); g.fillStyle = `rgba(254,178,180,${.55 * hl})`; g.fillRect(60, 196, 740 * hl, 64);
  ['06  max 3 trades a day', '07  2 losses in a row →', '      walk away. 20 minutes.', '08  journal every trade'].forEach((s, i) => txt(s, 70, 160 + i * 56 + (i > 0 ? 50 : 0), i === 1 || i === 2 ? 44 : 38, i === 1 || i === 2 ? '#15132a' : '#636080', 'left', i === 1 || i === 2 ? 800 : 500, 'Hand'));
  g.restore();
  // cooldown pill (journzey tilt alert)
  const secs = Math.max(0, 1200 - Math.floor(t * 1.5)); const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  const a = clamp((t - .9) * 3); g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(248,113,113,.14)'; g.strokeStyle = RED; g.lineWidth = 3; g.beginPath(); g.roundRect(160, 930, 760, 110, 55); g.fill(); g.stroke();
  txt('⚠ TILT ALERT · cooldown ' + mm + ':' + ss, W / 2, 1000, 38, '#fecaca', 'center', 800); g.restore();
  desk(240, 1780, { pose: t < 1.3 ? 'read' : 'walk', walk: clamp((t - 1.3) / 2) });
}
function s5(t) { // split equity curves
  label('TRADER A', 140); label('TRADER B', 1060);
  function curve(y0, pts, col, p, money, endLbl) { const x0 = 120, w = 840; g.strokeStyle = '#1d1c38'; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + w, y0); g.stroke();
    const n = Math.max(2, Math.floor(pts.length * p)); g.strokeStyle = col; g.lineWidth = 8; g.lineJoin = 'round'; g.beginPath(); pts.slice(0, n).forEach(([x, y], i) => i ? g.lineTo(x0 + x * w, y0 - y) : g.moveTo(x0 + x * w, y0 - y)); g.stroke();
    if (p >= 1) { txt(money, x0 + w, y0 - pts[pts.length - 1][1] + (col === RED ? 90 : -30), 64, col, 'right', 800); txt(endLbl, x0, y0 + 60, 26, MUTED, 'left', 500); } }
  const pA = [[0, 0], [.1, -40], [.2, -80], [.35, -160], [.5, -300], [.7, -480], [1, -560]].map(([x, y]) => [x, 250 + y * .55]);
  const pB = [[0, 0], [.1, -40], [.2, -80], [.45, -80], [.55, -60], [.75, 40], [1, 120]].map(([x, y]) => [x, 150 + y * .9]);
  curve(760, pA, RED, ease(t / 1.6), '−$1,400', 'blew the week');
  curve(1720, pB, GREEN, ease((t - .5) / 1.6), '+$300', 'walked away · came back next day');
  if (t > .4) txt('NEXT DAY', 120 + .55 * 840, 1440, 22, FAINT, 'center', 700);
}
const L1 = 'SAME RULES.', L2a = 'ONLY ONE ', L2b = 'WROTE THEM DOWN.';
function s6(t) {
  const n = Math.floor(Math.max(0, t - .1) * 18); txt(L1.slice(0, n), W / 2, 880, 70, INK, 'center', 800);
  const m = Math.max(0, n - L1.length - 3); if (m) { g.font = '800 62px Mono'; const full = g.measureText(L2a + L2b).width; let x = W / 2 - full / 2; const a = L2a.slice(0, m), b = L2b.slice(0, Math.max(0, m - L2a.length));
    txt(a, x, 980, 62, INK, 'left', 800); x += g.measureText(L2a).width; if (b) gradText(b, x, 980, 62, 'left'); }
  if (t > 2.4) { g.save(); g.globalAlpha = clamp((t - 2.4) * 2); gradText('journzey', W / 2, 1720, 54, 'center', 'Jakarta', 600); txt('coming soon', W / 2, 1768, 26, MUTED, 'center', 500); g.restore(); }
}
const SCENES = [s1, s2, s3, s4, s5, s6];
window.draw = (t) => {
  bg(); let k = 0; while (k < 5 && t >= S[k + 1]) k++; const lt = t - S[k];
  const z = 1 + .06 * (1 - ease(lt / .5)); g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2); SCENES[k](lt); g.restore();
  if (k > 0 && lt < .14) { g.fillStyle = `rgba(255,255,255,${.35 * (1 - lt / .14)})`; g.fillRect(0, 0, W, H); } // flash cut
  // progress bar
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, 0, W, 8); const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, '#7c5cff'); gr.addColorStop(1, '#feb2b4'); g.fillStyle = gr; g.fillRect(0, 0, W * clamp(t / 21.5), 8);
};
window.ready = Promise.all(['800 64px Mono', '500 24px Mono', '600 54px Jakarta', '44px Hand'].map(f => document.fonts.load(f))).then(() => draw(0));
</script></body></html>
