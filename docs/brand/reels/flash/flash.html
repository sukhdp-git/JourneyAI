function T(s, x, y, size, col, align = 'left', weight = 500, font = 'Inter', alpha = 1) { g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${font}`; g.fillStyle = col; g.textAlign = align; g.fillText(s, x, y); g.restore(); }
function brand(x0, x1) { const gr = g.createLinearGradient(x0, 0, x1, 0); BR.forEach((c, i) => gr.addColorStop(i / 4, c)); return gr; }

  T('BUY', 60 + (W - 100) * .75, bot + 160, 34, '#fff', 'center', 700); T((last.c + o.vol * .05).toFixed(o.dec), 60 + (W - 100) * .75, bot + 200, 30, '#fff', 'center', 500);

    g.strokeStyle = '#ffb74d'; g.lineWidth = 3; g.setLineDash([10, 8]); g.strokeRect(10 + a * st, y0, (b - a) * st, y1 - y0); g.setLineDash([]); T(lbl, 10 + a * st + 10, y0 - 14, 28, '#ffb74d', 'left', 600); }
}
